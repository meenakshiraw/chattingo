
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Git Clone
      - name: Checkout Code
        uses: actions/checkout@v3

      # Stage 2: Image Build
      - name: Build Frontend Docker Image
        run: docker build -t myrepo/frontend:latest ./frontend

      - name: Build Backend Docker Image 
        run: docker build -t myrepo/backend:latest ./backend

      # Stage 3: Filesystem Scan (Static Code Analysis)
      - name: Run Code Scan
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, java

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      # Stage 4: Image Scan (Trivy for vulnerabilities)
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myrepo/frontend:latest

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myrepo/backend:latest

      # Stage 5: Push to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Frontend Image
        run: docker push myrepo/frontend:latest

      - name: Push Backend Image
        run: docker push myrepo/backend:latest

      # Stage 6: Update docker-compose.yml with new tags (example step)
      - name: Update Docker Compose
        run: |
          sed -i "s|image: myrepo/frontend.*|image: myrepo/frontend:latest|g" docker-compose.yml
          sed -i "s|image: myrepo/backend.*|image: myrepo/backend:latest|g" docker-compose.yml

      # Stage 7: Deploy to VPS (via SSH)
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /path/to/app
            git pull origin main
            docker-compose pull
            docker-compose up -d
