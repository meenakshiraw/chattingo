name: CI/CD Pipeline

on:
  push:
    branches:
      - meenakshi
  pull_request:

jobs:
  build-deploy:
    runs-on: ubuntu-latest  
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
       fail-fast: false
       matrix:
        language: [ 'java', 'javascript' ]

    steps:
      # Stage 1: Git Clone
      - name: Checkout Code
        uses: actions/checkout@v3 

      # Stage 2: Image Build
      - name: Build Frontend Docker Image
        run: docker build -t frontend:latest ./frontend

      - name: Build Backend Docker Image
        run: docker build -t backend:latest ./backend

      # Stage 3: Filesystem Scan (Static Code Analysis)
      - name: Run Code Scan
        uses: github/codeql-action/init@v2
      

        with:
          languages: ${{ matrix.language }}

      # 👇 Add build step for Java (Maven example)
      - if: matrix.language == 'java'
        name: Build with Maven
        working-directory: ./backend
        run: mvn -B clean install -DskipTests

      # Stage 4: Image Scan (Trivy for vulnerabilities)
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:latest

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:latest

      # Stage 5: Push to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Frontend Image
        uses: docker/build-push-action@v4
        with:
         context: ./frontend
         push: true
         tags: ${{ secrets.DOCKER_USERNAME }}/myrepo/frontend:latest
         #tags: meenakshirawat/frontend:latest 

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
         context: ./backend
         push: true
         tags: ${{ secrets.DOCKER_USERNAME }}/myrepo/backend:latest
         #tags: meenakshirawat/backend:latest

        


      # Stage 6: Update docker-compose.yml with new tags (example step)
      - name: Update Docker Compose
        run: |
          #sed -i "s|image: myrepo/frontend.*|image: myrepo/frontend:latest|g" docker-compose.yml
          #sed -i "s|image: myrepo/backend.*|image: myrepo/backend:latest|g" docker-compose.yml

          #sed -i "s|image: frontend.*|image: frontend:latest|g" docker-compose.yml
          #sed -i "s|image: backend.*|image: backend:latest|g" docker-compose.yml

      # Stage 7: Deploy to VPS (via SSH)
      - name: Deploy on VPS 
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /path/to/app
            git pull origin meenakshi
            docker-compose pull
            docker-compose up -d
